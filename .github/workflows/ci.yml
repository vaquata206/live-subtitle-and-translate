name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test
      - run: pnpm turbo run build
      - name: Package extension
        run: pnpm --filter @lst/extension package
      - uses: actions/upload-artifact@v5
        with:
          name: extension-zip
          path: apps/extension/dist-zip/*.zip
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - name: web
            file: infra/docker/web.Dockerfile
            args: ''
          - name: realtime
            file: infra/docker/node-service.Dockerfile
            args: APP=realtime
          - name: worker
            file: infra/docker/node-service.Dockerfile
            args: APP=worker
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          tags: lst-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
