name: lst-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lst
      POSTGRES_PASSWORD: lst
      POSTGRES_DB: lst
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lst -d lst']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Catches all outgoing email in development: UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

  # S3-compatible storage for exports/avatars: console at http://localhost:9001
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: lst
      MINIO_ROOT_PASSWORD: lst-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  miniodata:
